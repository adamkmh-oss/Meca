# Passerelle locale : mêmes chemins que l'API Supabase hébergée.
map $http_origin $cors_origin {
  default "";
  "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
}

server {
  listen 80;
  client_max_body_size 60m;

  add_header Access-Control-Allow-Origin $cors_origin always;
  add_header Access-Control-Allow-Credentials "true" always;
  add_header Access-Control-Allow-Headers "apikey, authorization, x-client-info, content-type, prefer, range, accept-profile, content-profile, x-upsert, x-supabase-api-version, cache-control" always;
  add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
  add_header Access-Control-Expose-Headers "content-range, x-supabase-api-version" always;

  if ($request_method = OPTIONS) { return 204; }

  location /auth/v1/    { proxy_pass http://auth:9999/;    proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /rest/v1/    { proxy_pass http://rest:3000/;    proxy_set_header Host $host; }
  location /storage/v1/ { proxy_pass http://storage:5000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Prefix /storage/v1; }
  location /templates/  { alias /usr/share/nginx/templates/; default_type text/html; }
}
